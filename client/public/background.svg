<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Linear & Radial Background Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099" />
      <stop offset="35%" stop-color="#e5b839" />
      <stop offset="70%" stop-color="#f5bc2a" />
      <stop offset="100%" stop-color="#fff099" />
    </linearGradient>

    <radialGradient id="goldRadial" cx="80%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#fff099" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#e5b839" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f5bc2a" stop-opacity="0.6" />
    </radialGradient>

    <!-- Diagonal Seamless Solid Dot Pattern -->
    <pattern id="diagonalDotPattern" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <!-- Row 1 Solid Dots -->
      <circle cx="8" cy="8" r="1.5" fill="#573602" fill-opacity="0.7" />
      <circle cx="24" cy="8" r="1.5" fill="#573602" fill-opacity="0.7" />
      
      <!-- Row 2 Off-set Solid Dots for Diagonal Alignment -->
      <circle cx="0" cy="24" r="1.5" fill="#573602" fill-opacity="0.7" />
      <circle cx="16" cy="24" r="1.5" fill="#573602" fill-opacity="0.7" />
      <circle cx="32" cy="24" r="1.5" fill="#573602" fill-opacity="0.7" />
    </pattern>
  </defs>

  <!-- Background Base Layers -->
  <rect width="3840" height="2160" fill="url(#goldLinear)" />
  <rect width="3840" height="2160" fill="url(#goldRadial)" />

  <!-- Diagonal Dot Pattern Overlay -->
  <rect width="3840" height="2160" fill="url(#diagonalDotPattern)" />
</svg>